<!doctype html>
<html lang="en" data-invert-text="1">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Name</title>

  <style>
    @font-face {
      font-family: "Custom Font";
      src:
        url("./fonts/custom-font.woff2") format("woff2"),
        url("./fonts/custom-font.woff") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      /* Custom font — swap name and ./fonts/ paths above to match your files */
      --font-family: "Custom Font", system-ui, sans-serif;

      /*
        USER THEME — set these directly (hex, rgb, oklch, etc.)
      */
      --color-bg: #d500fb;
      --color-surface: #ffd000;
      --color-link: #ffffff;
      --color-link-hover: #99ff00;
      --color-border: #333340;
      --color-accent: #e100ff;
      --color-accent-2: #ffffff;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      --radius: 1px;

      /*
        TEXT INVERSION — flip data-invert-text on <html>:
          "1" = light text (dark UI)
          "0" = dark text (light UI)
      */
      --invert-text: 0;
      color-scheme: dark;
    }

    :root[data-invert-text="0"] {
      --invert-text: 0;
      color-scheme: light;
    }

    /*
      GUARDRAILED — derived for readable contrast; edit only if you
      understand the tradeoff (e.g. WCAG contrast on body / muted text).
    */
    :root {
      --color-text: color-mix(
        in srgb,
        #f5f5f5 calc(var(--invert-text) * 100%),
        #111111 calc((1 - var(--invert-text)) * 100%)
      );
      --color-muted: color-mix(in srgb, var(--color-text) 55%, var(--color-bg));
      --color-on-accent: color-mix(
        in srgb,
        #ffffff calc(var(--invert-text) * 100%),
        #111111 calc((1 - var(--invert-text)) * 100%)
      );
      --color-focus: var(--color-accent);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;

      font-family: var(--font-family);

      color: var(--color-text);

      background: var(--color-bg);
    }

    .card {
      width: 100%;
      max-width: 720px;

      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 1px;
      padding: 32px;

      box-shadow: var(--shadow);
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 16px;

      border-radius: 1px;

      display: grid;
      place-items: center;

      background:
        linear-gradient(
          135deg,
          var(--color-accent),
          var(--color-accent-2)
        );

      color: var(--color-on-accent);
      font-size: 2rem;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .subtitle {
      margin: 12px auto 0;
      max-width: 48ch;
      color: var(--color-muted);
      line-height: 1.5;
    }

    .links {
      list-style: none;
      padding: 0;
      margin: 0;

      display: grid;
      gap: 12px;
    }

    .links a {
      display: block;

      text-decoration: none;
      color: var(--color-text);

      padding: 18px 20px;

      border-radius: var(--radius);
      border: 1px solid var(--color-border);

      background: var(--color-link);

      font-weight: 700;

      transition:
        transform 160ms ease,
        background 160ms ease,
        border-color 160ms ease;
    }

    .links a:hover {
      transform: translateY(-2px);
      background: var(--color-link-hover);
      border-color: var(--color-accent);
    }

    .links a:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }

    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--color-muted);
    }

    @media (max-width: 640px) {
      .card {
        padding: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <header>
      <div class="avatar">YN</div>

      <h1>Your Name</h1>

      <p class="subtitle">
Description text goes here if you want.      </p>
    </header>

    <ul class="links">
      <li>
        <a href="https://example.com">
          Website
        </a>
      </li>

      <li>
        <a href="https://example.com">
          Listen
        </a>
      </li>

      <li>
        <a href="https://example.com">
          Shop
        </a>
      </li>

      <li>
        <a href="mailto:hello@example.com">
          Contact
        </a>
      </li>

      <li>
        <a href="./archive/">
          Archive
        </a>
      </li>
    </ul>

    <footer>
      © 2026 Your Name
    </footer>
  </main>
</body>
</html>
